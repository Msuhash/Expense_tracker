name: Keep Render & MongoDB Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from sleeping
    - cron: '*/14 * * * *'
  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API Endpoint
        run: |
          curl -s -o /dev/null -w "HTTP Status Code: %{http_code}\n" https://expense-tracker-backend-hu1z.onrender.com/
